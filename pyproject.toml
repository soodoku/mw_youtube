[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mw-youtube"
version = "0.1.0"
description = "Reproducible video sampling and frame-level analysis of street-food footage"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
[project.urls]
Repository = "https://github.com/soodoku/mw_youtube"

[tool.hatch.build.targets.wheel]
packages = ["scripts/mw_youtube"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "mw_youtube/config"
